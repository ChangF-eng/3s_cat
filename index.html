<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="开局只有十秒。趁主人背过身把物品推下桌，每件加五秒。">
  <title>三秒猫</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4ebdb;
      --page-light: #fffaf0;
      --dot: #dfd1bb;
      --ink: #30241c;
      --muted: #6a5546;
      --panel: #fff9ed;
      --edge: #d4bea2;
      --lip: #d9c4a8;
      --accent: #284d50;
      --accent-text: #fff9ec;
      --selected: #e0e9de;
      --selected-text: #26494a;
      --focus: #a84b28;
      --urgent: #9a412a;
      --result-success: #e9efdf;
      --result-success-edge: #a4b398;
      --result-success-ink: #2d4c3e;
      --result-failure: #f8e4d7;
      --result-failure-edge: #ca9b82;
      --result-failure-ink: #6c3528;
      --retry-failure: #873f2d;
      --retry-failure-ink: #fffbf3;
      font-family: "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #261f1b;
        --page-light: #3c3028;
        --dot: #4a3a2c;
        --ink: #f8e9d1;
        --muted: #d4bda8;
        --panel: #3d3128;
        --edge: #6c5643;
        --lip: #17120f;
        --accent: #b0d1c7;
        --accent-text: #173637;
        --selected: #395555;
        --selected-text: #e8faf4;
        --focus: #f4a473;
        --urgent: #ffb799;
        --result-success: #283d35;
        --result-success-edge: #5e7c6d;
        --result-success-ink: #e3f0dc;
        --result-failure: #463029;
        --result-failure-edge: #9c6552;
        --result-failure-ink: #ffdbc7;
        --retry-failure: #ebad91;
        --retry-failure-ink: #47291d;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--ink);
      background-color: var(--page);
      background-image: radial-gradient(circle, var(--dot) .7px, transparent .8px),
        radial-gradient(ellipse at 45% 12%, var(--page-light) 4%, transparent 78%);
      background-size: 16px 16px, auto;
    }

    main {
      width: min(calc(100% - 48px), 1120px);
      padding-block: 26px 32px;
    }
    main:focus { outline: none; }

    .masthead, .mark, .round-info, .touch-controls, .direction-buttons { display: flex; align-items: center; }
    .round-info, .touch-controls { justify-content: space-between; }
    .masthead { justify-content: space-between; gap: 12px; margin: 0 2px 14px; }
    .mark { gap: 12px; }
    .mark svg { display: block; width: 44px; height: 44px; flex: none; }
    h1 { margin: 0; font-size: clamp(1.55rem, 4.4vw, 2.15rem); line-height: 1.2; font-weight: 900; letter-spacing: .055em; }
    .clock {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 4px;
      padding: 7px 9px;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: var(--panel);
      font-size: .875rem;
      white-space: nowrap;
    }
    .clock[data-low] { color: var(--urgent); }
    .clock-value { min-width: 4ch; text-align: right; font: 750 1.125rem/1 ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .time-bonus {
      position: absolute;
      z-index: 1;
      left: calc(100% + 6px);
      top: 50%;
      transform: translateY(-50%);
      padding: 4px 7px;
      border-radius: 5px;
      background: var(--selected);
      color: var(--selected-text);
      font-weight: 750;
      pointer-events: none;
    }

    .frame {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 20px;
      padding: 6px;
      box-shadow: 0 5px var(--lip), 0 19px 28px -20px #43271465;
    }

    .scene { position: relative; border-radius: 14px; overflow: hidden; background: #f0dfbb; }
    .room { display: block; width: 100%; height: auto; }
    .scene-hud {
      position: absolute;
      inset: clamp(8px, 1.6vw, 18px) auto auto 50%;
      transform: translateX(-50%);
      display: grid;
      justify-items: center;
      gap: 6px;
      pointer-events: none;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 5px 12px;
      border: 1px solid #bfa782;
      border-radius: 8px;
      background: #fff5df;
      color: #584232;
      box-shadow: 0 2px #9a785046;
      font-size: .875rem;
      font-weight: 750;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }

    .status::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
    .status[data-pose="away"] { background: #edf4e5; color: #345647; border-color: #aabca3; }
    .status[data-pose="warning"] { background: #ffebac; color: #773c20; border-color: #be8b54; }
    .status[data-pose="lost"], .status[data-pose="expired"] { background: #ffe4d4; color: #843c27; border-color: #be8b73; }
    .status[data-pose="won"] { background: #edf4e5; color: #345647; border-color: #aabca3; }
    .owner-pose { display: none; }
    .room[data-pose="away"] .owner-away,
    .room[data-pose="warning"] .owner-warning,
    .room[data-pose="watch"][data-look="side"] .owner-warning,
    .room[data-pose="watch"][data-look="front"] .owner-watch { display: inline; }
    .room[data-head="back"] #owner-turn-side,
    .room[data-head="side"] #owner-turn-back { display: none; }
    .item-outline { visibility: hidden; }
    [data-near="true"] .item-outline { visibility: visible; }
    [data-near="true"][data-at-edge] .item-outline { stroke: #fff0a0; }
    .cat-eyelids, #cat[data-blink] .cat-eyes { visibility: hidden; }
    #cat[data-blink] .cat-eyelids { visibility: visible; }

    .game-panel { min-height: 83px; margin: 19px 2px 0; }
    .round-info { gap: 12px; min-height: 46px; }
    .round-copy { min-width: 0; }
    .rules { margin: 0; color: var(--ink); font-size: .9375rem; line-height: 1.55; }
    .keyboard-hint { color: var(--muted); }
    .keyboard-hint { display: flex; flex-wrap: wrap; gap: 8px 15px; align-items: center; margin: 6px 0 0; font-size: .875rem; }
    kbd { display: inline-block; min-width: 23px; padding: 2px 5px; text-align: center; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--edge); border-bottom-width: 2px; border-radius: 4px; }
    .touch-controls { display: none; gap: 12px; margin-top: 12px; }
    .direction-buttons { gap: 8px; }
    [hidden] { display: none !important; }
    button {
      font-family: inherit;
      font-size: .875rem;
      font-weight: 750;
      line-height: 1.2;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 8px;
      min-height: 44px;
      padding: 8px 13px;
      white-space: nowrap;
      touch-action: manipulation;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .sound-toggle { min-width: 76px; }
    .sound-toggle[aria-pressed="false"] { color: var(--muted); }
    .primary { color: var(--accent-text); background: var(--accent); border-color: var(--accent); min-width: 104px; padding-inline: 15px; }
    .result-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: min(100%, 520px);
      min-height: 74px;
      padding: 12px 15px;
      margin-inline: auto;
      color: var(--result-failure-ink);
      background: var(--result-failure);
      border: 1px solid var(--result-failure-edge);
      border-radius: 12px;
      box-shadow: 0 3px var(--lip);
    }
    .result-card[data-result="won"] { color: var(--result-success-ink); background: var(--result-success); border-color: var(--result-success-edge); }
    .result-title { margin: 0; font-size: clamp(1.0625rem, 2vw, 1.25rem); font-weight: 800; line-height: 1.35; }
    .result-title:focus { outline: none; }
    .result-card:not([data-result="won"]) .primary { color: var(--retry-failure-ink); background: var(--retry-failure); border-color: var(--retry-failure); }
    .touch-button { height: 52px; min-width: 58px; touch-action: none; user-select: none; -webkit-touch-callout: none; border-bottom-width: 3px; }
    .touch-button--move { font-size: 1.2rem; }
    .touch-button--swat { min-width: 106px; color: var(--selected-text); background: var(--selected); border-color: var(--accent); }
    .touch-button.held, .touch-button:active { transform: translateY(2px); }
    .touch-button:disabled { opacity: .6; cursor: default; }

    @media (hover: hover) {
      button:enabled:hover { border-color: var(--accent); }
      .primary:hover { opacity: .88; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .status[data-pose="warning"]::before { animation: warn .25s alternate 4; }
      @keyframes warn { to { opacity: .45; } }
    }
    @media (min-width: 930px) and (min-height: 650px) {
      main { width: min(calc(100% - 64px), 1120px, calc((100svh - 222px) * 1.6667)); }
    }
    @media (any-pointer: coarse), (max-width: 640px) {
      .touch-controls { display: flex; }
    }
    @media (min-width: 641px) and (any-pointer: coarse) {
      .play-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; }
      .touch-controls { margin-top: 0; }
    }
    @media (max-width: 640px) {
      .keyboard-hint { display: none; }
      .game-panel { min-height: 128px; }
      .result-card { grid-template-columns: minmax(0, 1fr); padding: 12px; }
      .result-card .primary { min-height: 48px; width: 100%; }
      .scene { display: grid; grid-template: "hud" auto "room" auto / minmax(0, 1fr); background: none; }
      .room { grid-area: room; border-radius: inherit; }
      .scene-hud { grid-area: hud; position: static; transform: none; justify-self: center; margin: 4px 0 8px; }
    }
    @media (max-width: 560px) {
      main { width: calc(100% - 24px); }
      .mark { gap: 8px; }
      .mark svg { width: 37px; height: 37px; }
      .masthead { margin-bottom: 10px; }
      .frame { padding: 4px; border-radius: 15px; }
      .scene { border-radius: 10px; }
      .game-panel { margin-top: 15px; }
      .rules { min-height: 3.1em; align-content: center; }
      .primary { min-width: 88px; padding-inline: 10px; }
    }
  </style>
</head>
<body>
  <main tabindex="-1">
    <header class="masthead">
      <div class="mark">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <rect x="1" y="4" width="42" height="39" rx="10" fill="#b97942"/>
          <rect x="1" y="1" width="42" height="39" rx="10" fill="#f4bd72"/>
          <path d="M10 12h5v2h4v3h7v-3h4v-2h4v19h-5v3H15v-3h-5Z" fill="#353c40"/>
          <path d="M13 15h3v4h-3zm15 0h3v4h-3z" fill="#d88b72"/>
          <path d="M15 23h4v5h-4zm10 0h4v5h-4z" fill="#f6d28b"/>
          <path d="M20 28h4v3h-4z" fill="#f2ac90"/>
        </svg>
        <h1>三秒猫</h1>
      </div>
      <button id="toggle-sound" type="button" class="sound-toggle" aria-label="音效" aria-pressed="true" hidden>音效开</button>
    </header>

    <div class="frame">
      <div class="scene">
        <svg class="room" data-pose="watch" data-look="front" data-head="back" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="room-title room-description">
          <title id="room-title">午后的积木书房</title>
          <desc id="room-description">窗光照在浅木书桌上。深灰猫坐在左侧蓝色坐垫上，右边依次是黄色铅笔、青绿色杯子和红扣钥匙。黄脑袋、绿眼睛的主人穿着深色西装，站在桌后右侧。</desc>
          <defs>
            <linearGradient id="wall" x2="1" y2=".68" gradientUnits="objectBoundingBox">
              <stop stop-color="#faeccc"/><stop offset="1" stop-color="#dfc29c"/>
            </linearGradient>
            <linearGradient id="floor" x2=".24" y2="1" gradientUnits="objectBoundingBox">
              <stop stop-color="#dcac7d"/><stop offset="1" stop-color="#e8c699"/>
            </linearGradient>
            <linearGradient id="outside" x2="0" y2="1" gradientUnits="objectBoundingBox">
              <stop stop-color="#abc4bd"/><stop offset="1" stop-color="#e6dbac"/>
            </linearGradient>
            <linearGradient id="desktop" x2="1" y2=".4" gradientUnits="objectBoundingBox">
              <stop stop-color="#f3c98d"/><stop offset=".55" stop-color="#f0c082"/><stop offset="1" stop-color="#da9d65"/>
            </linearGradient>
            <linearGradient id="apron" x2="1" y2="0" gradientUnits="objectBoundingBox">
              <stop stop-color="#d59158"/><stop offset="1" stop-color="#c4804d"/>
            </linearGradient>
            <clipPath id="window-pane"><rect x="118" y="76" width="241" height="153" rx="2"/></clipPath>
            <clipPath id="desk-surface"><path d="M155 350H923L873 432H92Z"/></clipPath>
            <g id="wood-stud">
              <path d="M0-2h15v4l-4 3H-4V1Z" fill="#9a643d" opacity=".32"/>
              <path d="M0-3h15l-4 4H-4Z" fill="#fff1c1" opacity=".62"/>
            </g>
          </defs>

          <!-- Wall, floor, and window light sit behind the playable silhouette. -->
          <rect width="1000" height="460" fill="url(#wall)"/>

          <!-- The view outside the window is assembled in low-contrast relief. -->

            <path d="M239 71h10v163h-10zm-127 77h253v9H112z" fill="#f0cca0"/>

          </g>

            <path d="M459 220h145l17-9h17l-22 24H446Z" fill="#bb936b" opacity=".25"/>

          </g>

          <g class="owner" aria-hidden="true">
            <defs>
              <linearGradient id="owner-gold" x1="0" y1="0" x2=".83" y2="1">
                <stop stop-color="#ffe889"/><stop offset=".58" stop-color="#ffc943"/><stop offset="1" stop-color="#e9a52b"/>

                <path d="M690 163l16-22 19-12 22-4 24 4 12 7-31 1-28 5-21 15Z" fill="#ffed9d"/>

            </defs>

            <g class="owner-pose owner-away">
              <use id="owner-away-head" href="#owner-back-head"/>
              <path d="M680 241l25-8 39-4 46 3 27 8 12 19-166 1Z" fill="#fff2d6"/>

              <path d="M648 294l23-36 24-14 30-5h52l28 5 25 15-19 5-26-11-32-4-52 4-25 12Z" fill="#64625c"/>

            </g>

            <g class="owner-pose owner-warning">
              <g id="owner-shoulders">
                <path d="M672 244l35-9 44-7 39 19 32 25 19 31 11 42-5 67H639l-4-66 5-48 10-36Z" fill="url(#owner-suit)"/>
                <path d="M635 346l5-48 10-36 22-18 35-9 30 3-9 14-38 2-22 13-15 34-8 48Z" fill="#66645e"/>
