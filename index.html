<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="开局只有十秒。趁主人背过身把物品推下桌，每件加五秒。">
  <title>三秒猫</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4ebdb;
      --page-light: #fffaf0;
      --dot: #dfd1bb;
      --ink: #30241c;
      --muted: #6a5546;
      --panel: #fff9ed;
      --edge: #d4bea2;
      --lip: #d9c4a8;
      --accent: #284d50;
      --accent-text: #fff9ec;
      --selected: #e0e9de;
      --selected-text: #26494a;
      --focus: #a84b28;
      --urgent: #9a412a;
      --result-success: #e9efdf;
      --result-success-edge: #a4b398;
      --result-success-ink: #2d4c3e;
      --result-failure: #f8e4d7;
      --result-failure-edge: #ca9b82;
      --result-failure-ink: #6c3528;
      --retry-failure: #873f2d;
      --retry-failure-ink: #fffbf3;
      font-family: "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #261f1b;
        --page-light: #3c3028;
        --dot: #4a3a2c;
        --ink: #f8e9d1;
        --muted: #d4bda8;
        --panel: #3d3128;
        --edge: #6c5643;
        --lip: #17120f;
        --accent: #b0d1c7;
        --accent-text: #173637;
        --selected: #395555;
        --selected-text: #e8faf4;
        --focus: #f4a473;
        --urgent: #ffb799;
        --result-success: #283d35;
        --result-success-edge: #5e7c6d;
        --result-success-ink: #e3f0dc;
        --result-failure: #463029;
        --result-failure-edge: #9c6552;
        --result-failure-ink: #ffdbc7;
        --retry-failure: #ebad91;
        --retry-failure-ink: #47291d;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--ink);
      background-color: var(--page);
      background-image: radial-gradient(circle, var(--dot) .7px, transparent .8px),
        radial-gradient(ellipse at 45% 12%, var(--page-light) 4%, transparent 78%);
      background-size: 16px 16px, auto;
    }

    main {
      width: min(calc(100% - 48px), 1120px);
      padding-block: 26px 32px;
    }
    main:focus { outline: none; }

    .masthead, .mark, .round-info, .touch-controls, .direction-buttons { display: flex; align-items: center; }
    .round-info, .touch-controls { justify-content: space-between; }
    .masthead { justify-content: space-between; gap: 12px; margin: 0 2px 14px; }
    .mark { gap: 12px; }
    .mark svg { display: block; width: 44px; height: 44px; flex: none; }
    h1 { margin: 0; font-size: clamp(1.55rem, 4.4vw, 2.15rem); line-height: 1.2; font-weight: 900; letter-spacing: .055em; }
    .clock {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 4px;
      padding: 7px 9px;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: var(--panel);
      font-size: .875rem;
      white-space: nowrap;
    }
    .clock[data-low] { color: var(--urgent); }
    .clock-value { min-width: 4ch; text-align: right; font: 750 1.125rem/1 ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .time-bonus {
      position: absolute;
      z-index: 1;
      left: calc(100% + 6px);
      top: 50%;
      transform: translateY(-50%);
      padding: 4px 7px;
      border-radius: 5px;
      background: var(--selected);
      color: var(--selected-text);
      font-weight: 750;
      pointer-events: none;
    }

    .frame {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 20px;
      padding: 6px;
      box-shadow: 0 5px var(--lip), 0 19px 28px -20px #43271465;
    }

    .scene { position: relative; border-radius: 14px; overflow: hidden; background: #f0dfbb; }
    .room { display: block; width: 100%; height: auto; }
    .scene-hud {
      position: absolute;
      inset: clamp(8px, 1.6vw, 18px) auto auto 50%;
      transform: translateX(-50%);
      display: grid;
      justify-items: center;
      gap: 6px;
      pointer-events: none;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 5px 12px;
      border: 1px solid #bfa782;
      border-radius: 8px;
      background: #fff5df;
      color: #584232;
      box-shadow: 0 2px #9a785046;
      font-size: .875rem;
      font-weight: 750;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }

    .status::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
    .status[data-pose="away"] { background: #edf4e5; color: #345647; border-color: #aabca3; }
    .status[data-pose="warning"] { background: #ffebac; color: #773c20; border-color: #be8b54; }
    .status[data-pose="lost"], .status[data-pose="expired"] { background: #ffe4d4; color: #843c27; border-color: #be8b73; }
    .status[data-pose="won"] { background: #edf4e5; color: #345647; border-color: #aabca3; }
    .item-outline { visibility: hidden; }
    [data-near="true"] .item-outline { visibility: visible; }
    [data-near="true"][data-at-edge] .item-outline { stroke: #fff0a0; }
    .cat-eyelids, #cat[data-blink] .cat-eyes { visibility: hidden; }
    #cat[data-blink] .cat-eyelids { visibility: visible; }

    .game-panel { min-height: 83px; margin: 19px 2px 0; }
    .round-info { gap: 12px; min-height: 46px; }
    .round-copy { min-width: 0; }
    .rules { margin: 0; color: var(--ink); font-size: .9375rem; line-height: 1.55; }
    .keyboard-hint { color: var(--muted); }
    .keyboard-hint { display: flex; flex-wrap: wrap; gap: 8px 15px; align-items: center; margin: 6px 0 0; font-size: .875rem; }
    kbd { display: inline-block; min-width: 23px; padding: 2px 5px; text-align: center; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--edge); border-bottom-width: 2px; border-radius: 4px; }
    .touch-controls { display: none; gap: 12px; margin-top: 12px; }
    .direction-buttons { gap: 8px; }
    [hidden] { display: none !important; }
    button {
      font-family: inherit;
      font-size: .875rem;
      font-weight: 750;
      line-height: 1.2;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 8px;
      min-height: 44px;
      padding: 8px 13px;
      white-space: nowrap;
      touch-action: manipulation;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .sound-toggle { min-width: 76px; }
    .sound-toggle[aria-pressed="false"] { color: var(--muted); }
    .primary { color: var(--accent-text); background: var(--accent); border-color: var(--accent); min-width: 104px; padding-inline: 15px; }
    .result-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: min(100%, 520px);
      min-height: 74px;
      padding: 12px 15px;
      margin-inline: auto;
      color: var(--result-failure-ink);
      background: var(--result-failure);
      border: 1px solid var(--result-failure-edge);
      border-radius: 12px;
      box-shadow: 0 3px var(--lip);
    }
    .result-card[data-result="won"] { color: var(--result-success-ink); background: var(--result-success); border-color: var(--result-success-edge); }
    .result-title { margin: 0; font-size: clamp(1.0625rem, 2vw, 1.25rem); font-weight: 800; line-height: 1.35; }
    .result-title:focus { outline: none; }
    .result-card:not([data-result="won"]) .primary { color: var(--retry-failure-ink); background: var(--retry-failure); border-color: var(--retry-failure); }
    .touch-button { height: 52px; min-width: 58px; touch-action: none; user-select: none; -webkit-touch-callout: none; border-bottom-width: 3px; }
    .touch-button--move { font-size: 1.2rem; }
    .touch-button--swat { min-width: 106px; color: var(--selected-text); background: var(--selected); border-color: var(--accent); }
    .touch-button.held, .touch-button:active { transform: translateY(2px); }
    .touch-button:disabled { opacity: .6; cursor: default; }

    @media (hover: hover) {
      button:enabled:hover { border-color: var(--accent); }
      .primary:hover { opacity: .88; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .status[data-pose="warning"]::before { animation: warn .25s alternate 4; }
      @keyframes warn { to { opacity: .45; } }
    }
    @media (min-width: 930px) and (min-height: 650px) {
      main { width: min(calc(100% - 64px), 1120px, calc((100svh - 222px) * 1.6667)); }
    }
    @media (any-pointer: coarse), (max-width: 640px) {
      .touch-controls { display: flex; }
    }
    @media (min-width: 641px) and (any-pointer: coarse) {
      .play-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; }
      .touch-controls { margin-top: 0; }
    }
    @media (max-width: 640px) {
      .keyboard-hint { display: none; }
      .game-panel { min-height: 128px; }
      .result-card { grid-template-columns: minmax(0, 1fr); padding: 12px; }
      .result-card .primary { min-height: 48px; width: 100%; }
      .scene { display: grid; grid-template: "hud" auto "room" auto / minmax(0, 1fr); background: none; }
      .room { grid-area: room; border-radius: inherit; }
      .scene-hud { grid-area: hud; position: static; transform: none; justify-self: center; margin: 4px 0 8px; }
    }
    @media (max-width: 560px) {
      main { width: calc(100% - 24px); }
      .mark { gap: 8px; }
      .mark svg { width: 37px; height: 37px; }
      .masthead { margin-bottom: 10px; }
      .frame { padding: 4px; border-radius: 15px; }
      .scene { border-radius: 10px; }
      .game-panel { margin-top: 15px; }
      .rules { min-height: 3.1em; align-content: center; }
      .primary { min-width: 88px; padding-inline: 10px; }
    }
  </style>
</head>
<body>
  <main tabindex="-1">
    <header class="masthead">
      <div class="mark">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <rect x="1" y="4" width="42" height="39" rx="10" fill="#b97942"/>
          <rect x="1" y="1" width="42" height="39" rx="10" fill="#f4bd72"/>
          <path d="M10 12h5v2h4v3h7v-3h4v-2h4v19h-5v3H15v-3h-5Z" fill="#353c40"/>
          <path d="M13 15h3v4h-3zm15 0h3v4h-3z" fill="#d88b72"/>
          <path d="M15 23h4v5h-4zm10 0h4v5h-4z" fill="#f6d28b"/>
          <path d="M20 28h4v3h-4z" fill="#f2ac90"/>
        </svg>
        <h1>三秒猫</h1>
      </div>
      <button id="toggle-sound" type="button" class="sound-toggle" aria-label="音效" aria-pressed="true" hidden>音效开</button>
    </header>

    <div class="frame">
      <div class="scene">
        <svg class="room" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="room-title room-description">
          <title id="room-title">午后的积木书房</title>
          <desc id="room-description">窗光照在浅木书桌上。深灰猫坐在左侧蓝色坐垫上，右边依次是黄色铅笔、青绿色杯子和红扣钥匙。黄脑袋、绿眼睛的主人穿着深色西装，站在桌后右侧。</desc>
          <defs>
            <linearGradient id="wall" x2="1" y2=".68" gradientUnits="objectBoundingBox">
              <stop stop-color="#faeccc"/><stop offset="1" stop-color="#dfc29c"/>
            </linearGradient>
            <linearGradient id="floor" x2=".24" y2="1" gradientUnits="objectBoundingBox">
              <stop stop-color="#dcac7d"/><stop offset="1" stop-color="#e8c699"/>
            </linearGradient>
            <linearGradient id="outside" x2="0" y2="1" gradientUnits="objectBoundingBox">
              <stop stop-color="#abc4bd"/><stop offset="1" stop-color="#e6dbac"/>
            </linearGradient>
            <linearGradient id="desktop" x2="1" y2=".4" gradientUnits="objectBoundingBox">
              <stop stop-color="#f3c98d"/><stop offset=".55" stop-color="#f0c082"/><stop offset="1" stop-color="#da9d65"/>
            </linearGradient>
            <linearGradient id="apron" x2="1" y2="0" gradientUnits="objectBoundingBox">
              <stop stop-color="#d59158"/><stop offset="1" stop-color="#c4804d"/>
            </linearGradient>
            <clipPath id="window-pane"><rect x="118" y="76" width="241" height="153" rx="2"/></clipPath>
            <clipPath id="desk-surface"><path d="M155 350H923L873 432H92Z"/></clipPath>
            <g id="wood-stud">
              <path d="M0-2h15v4l-4 3H-4V1Z" fill="#9a643d" opacity=".32"/>
              <path d="M0-3h15l-4 4H-4Z" fill="#fff1c1" opacity=".62"/>
            </g>
          </defs>

          <!-- Wall, floor, and window light sit behind the playable silhouette. -->
          <rect width="1000" height="460" fill="url(#wall)"/>
          <path d="M962 0h38v472h-38z" fill="#c59d7a" opacity=".29"/>

          </g>

          <g id="owner" aria-hidden="true">

            <path d="M-38-9h17l4 4h-24Z" fill="#f6a087"/>
            <path d="M-23-5h5v5h-5Z" fill="#873f35"/>
            <path d="M-22-4h8l5 3-1 6h-10V2h7V-1h-9Z" fill="#f6e5bf"/>
            <path fill-rule="evenodd" d="M-7-10H9l7 7h26v7h-6v6h-5V6h-7v4h-5V5h-7l-4 6H-8l-7-7v-7Zm1 5v10H6V-5Z" fill="#6e7479"/>
            <path fill-rule="evenodd" d="M-7-12H9l7 7h26v7h-6v6h-5V4h-7v4h-5V3h-7l-4 6H-8l-7-7v-7Zm1 7v10H6V-5Z" fill="#c3c5bb"/>
            <path d="M-7-12H9l7 7h26v2H15l-7-6H-9Z" fill="#f3eee0"/>
          </g>
        </svg>

        <div class="scene-hud">
          <div class="clock" role="timer" aria-label="本局剩余时间">
            <span>剩余</span>
            <span id="time" class="clock-value">10.0</span> 秒
            <span id="time-bonus" class="time-bonus" hidden></span>
          </div>
          <div class="status" data-pose="ready">
            <span id="status-label" aria-live="polite" aria-atomic="true">准备</span>
          </div>
        </div>
      </div>
    </div>

    <div class="game-panel">
      <div class="play-controls">
        <div class="round-info">
          <div class="round-copy">
            <p id="rules" class="rules">推落一件加 5 秒，主人回头前停步收爪。</p>
            <p class="keyboard-hint"><span><kbd>←</kbd> <kbd>→</kbd> 移动</span><span><kbd>空格</kbd> 拨爪</span></p>
          </div>
          <button id="start-game" type="button" class="primary">开始游戏</button>
        </div>
        <div class="touch-controls" role="group" aria-label="猫咪操作">
          <div class="direction-buttons">
            <button type="button" class="touch-button touch-button--move" aria-label="向左移动" data-move="-1" disabled>←</button>
            <button type="button" class="touch-button touch-button--move" aria-label="向右移动" data-move="1" disabled>→</button>
          </div>
          <button id="touch-swat" type="button" class="touch-button touch-button--swat" disabled>拨爪</button>
        </div>
      </div>
      <section id="outcome" class="result-card" aria-labelledby="outcome-title" hidden>
        <h2 id="outcome-title" class="result-title" tabindex="-1"></h2>
        <button id="retry-game" type="button" class="primary">再来一局</button>
      </section>
    </div>
  </main>

  <script>
    const statusBadge = document.querySelector('.status');
    const statusLabel = document.querySelector('#status-label');
    const clock = document.querySelector('.clock');
    const time = document.querySelector('#time');
    const timeBonus = document.querySelector('#time-bonus');
    const cat = document.querySelector('#cat');
    const forepaw = document.querySelector('#cat-forepaw');
    const farPaw = document.querySelector('#cat-far-paw');
    const owner = document.querySelector('#owner');
    const ownerFrame = document.querySelector('#owner-frame');
    const ownerFrameWidth = 176;
    const ownerFrameHeight = 220;
    const ownerAtlasColumns = 5;
    const ownerSideFrame = 9;
    const ownerFrontFrame = 18;
    const startButton = document.querySelector('#start-game');
    const retryButton = document.querySelector('#retry-game');
    const soundButton = document.querySelector('#toggle-sound');
    const playControls = document.querySelector('.play-controls');
    const movementButtons = document.querySelectorAll('[data-move]');
    const swatButton = document.querySelector('#touch-swat');
    const rules = document.querySelector('#rules');
    const defaultRules = rules.textContent;
    const outcome = document.querySelector('#outcome');
    const outcomeTitle = document.querySelector('#outcome-title');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    const labels = { ready: '准备', away: '可以动', warning: '快停', watch: '别动', won: '过关', lost: '被抓', expired: '时间到' };
    const startingTime = 10000;
    const dropBonus = 5000;
    const bellWarningLead = 900;
    const watchLengths = { side: 1000, front: 1400 };
    const swatLength = 375;
    const contactDelay = 115;
    const slideLength = 240;
    const dropLength = 510;
    const victoryLength = 880;
    const startX = 246;
    const leftEdge = 172;
    const rightEdge = 824;
    const catSpeed = 255 / 1000;
    const footstepDistance = catSpeed * 500;
    const stepSpacing = Math.PI * 12;
    const reach = 82;

    const items = [
      {
        id: 'pencil',
        bonus: dropBonus,
        required: true,
        x: 454,
        poses: [
          { y: 396, angle: -9 },
          { y: 422, angle: 4, hint: '铅笔到了桌沿，再拨一爪就掉。' },
        ],
        landingPose: { x: 493, y: 566, angle: 365 },
      },
      {
        id: 'cup',
        bonus: dropBonus,
        required: true,
        x: 606,
        poses: [
          { y: 403, angle: 0 },
          { y: 428, angle: 34, rock: 10, hint: '杯子歪在桌沿，再拨一爪就掉。' },
        ],
        landingPose: { x: 582, y: 550, angle: 447 },
      },
      {
        id: 'bell',
        x: 682,
        bonus: 3000,
        required: false,
        poses: [
          { y: 408, angle: 0, hint: '铃铛可跳过 · 推落 +3 秒 · 会惊动主人' },
        ],
        landingPose: { x: 657, y: 568, angle: -272 },
      },
      {
        id: 'keys',
        bonus: dropBonus,
        required: true,
        x: 759,
        poses: [
          { y: 393, angle: -8 },
          { y: 411, angle: 12, hint: '钥匙滑近桌沿，再拨两爪。' },
          { y: 427, angle: -72, hint: '钥匙圈挂住了，再拨一爪就掉。' },
        ],
        landingPose: { x: 705, y: 569, angle: -367 },
      },
    ];
    for (const item of items) {
      item.element = document.getElementById(item.id);
      item.shadow = document.getElementById(item.id + '-shadow');
      item.landing = document.getElementById(item.id + '-landing');
      item.pushes = 0;
      item.pushedAt = null;
      item.landed = false;
    }

    const moves = new Map();
    let phase = 'ready';
    let phaseEndsAt = 0;
    let gameEndsAt = 0;
    let bonusEndsAt = 0;
    let turn = null;
    let lastTime = 0;
    let pauseStartedAt = null;
    let frame = null;
    let catX = startX;
    let facing = 1;
    let stride = 0;
    let swat = null;
    let caughtAction = null;
    let timeoutFrame = null;

    const GameAudioContext = window.AudioContext || window.webkitAudioContext;
    const soundSources = new Set();
    let audioContext;
    let soundEnabled = true;
    let noiseBuffer;
    let failureBuffer;

    // Each layer specifies wave type, frequency, duration, gain, delay, and optional end frequency.
    const soundEffects = {
      away: [['sine', 523, .10, .10], ['triangle', 659, .15, .07, .065]],
      step: [['noise', 650, .045, .055], ['sine', 180, .047, .038, 0, 95]],
      paw: [['noise', 1900, .10, .09, 0, 680]],
      warning: [['triangle', 392, .10, .13], ['triangle', 294, .17, .12, .115]],
      watch: [['sine', 230, .115, .085, 0, 150]],
      pencilPush: [['noise', 1000, .095, .085, 0, 530], ['triangle', 640, .048, .042]],
      cupPush: [['sine', 935, .145, .082], ['noise', 1450, .055, .085]],
      bellPush: [['sine', 2093, .32, .14], ['sine', 3136, .20, .075, .012], ['sine', 4186, .11, .038, .025]],
      bellLand: [['noise', 1200, .06, .045, 0, 550]],
      keysPush: [['sine', 1680, .065, .059], ['sine', 2260, .11, .05, .04]],
      pencilLand: [['triangle', 440, .063, .13, 0, 285], ['noise', 1650, .044, .13], ['triangle', 520, .045, .07, .085]],
      cupLand: [['sine', 775, .24, .14], ['sine', 1420, .13, .084], ['noise', 580, .085, .18], ['sine', 980, .15, .085, .15]],
      keysLand: [['triangle', 1560, .13, .11], ['sine', 2050, .16, .10, .035], ['sine', 1120, .15, .085, .06], ['sine', 2660, .10, .052, .12]],
      bonus: [['sine', 784, .12, .10, .045], ['triangle', 1047, .19, .095, .115]],
      won: [['triangle', 523, .16, .12, .28], ['triangle', 659, .16, .12, .39], ['sine', 784, .26, .15, .50], ['sine', 1047, .30, .11, .65]],
    };

    function isPlaying() {
      return phase === 'watch' || phase === 'away';
    }

    function direction() {
      let total = 0;
      for (const value of moves.values()) total += value;
      return Math.sign(total);
    }

    function canStep(heading) {
      return (heading < 0 && catX > leftEdge) || (heading > 0 && catX < rightEdge);
    }

    function isDropped(item) {
      return item.pushes === item.poses.length;
    }

    function nearbyItem(heading = 0) {
      let closest;
      let nearestDistance = Infinity;
      for (const item of items) {
        const offset = item.x - catX;
        const distance = Math.abs(offset);
        if (isDropped(item) || distance > reach || distance >= nearestDistance || offset * heading < -22) continue;
        closest = item;
        nearestDistance = distance;
      }
      return closest;
    }

    function transform(element, value) {
      if (element.getAttribute('transform') !== value) element.setAttribute('transform', value);
    }

    function showPressedButtons() {
      const held = [...moves.values()];
      for (const button of movementButtons) {
        button.classList.toggle('held', held.includes(Number(button.dataset.move)));
      }
    }

    function setControls(playing) {
      startButton.hidden = playing;
      swatButton.disabled = !playing;
      for (const button of movementButtons) button.disabled = !playing;
      showPressedButtons();
    }

    function finish(result, action = null) {
      if (result === 'expired') {
        timeoutFrame = {
          ownerPose: phase === 'away' ? (turn.warned ? 'warning' : 'away') : 'watch',
          stepping: phase === 'away' && canStep(direction()),
        };
      }
      phase = result;
      caughtAction = action;
      moves.clear();
      setControls(false);
      playControls.hidden = true;
      outcome.dataset.result = result;
      outcomeTitle.textContent = result === 'won' ? '装乖成功！' : '被奶蛙发现啦';
      outcome.hidden = false;
      outcomeTitle.focus({ preventScroll: true });
      if (result === 'won') {
        playSound('won');
      } else {
        stopSounds();
        playFailure(lastTime);
      }
    }

    function chooseLook(sideChance) {
      const side = Math.random() < sideChance;
      return {
        look: side ? 'side' : 'front',
        lead: (side ? 700 : 850) + Math.round(Math.random() * 150),
      };
    }

    function lookTilt(look) {
      return look === 'side' ? -5 - Math.random() * 7 : -2 - Math.random() * 3;
    }

    function beginTurn(now, first = false) {
      const { look, lead } = first ? { look: 'front', lead: 900 } : chooseLook(.5);
      const length = first ? 3000 : 1650 + Math.round(Math.random() * 950) + lead;
      const tilt = first ? -4 : lookTilt(look);
      phase = 'away';
      phaseEndsAt = now + length;
      turn = { first, look, lead, tilt, startedAt: now, warningAt: phaseEndsAt - lead, warned: false, distance: 0 };
    }

    function footstepWarningAt(heading) {
      if (phase !== 'away' || turn.first || turn.warned || !canStep(heading)) return Infinity;
      const distanceLeft = Math.max(0, footstepDistance - turn.distance);
      const available = heading > 0 ? rightEdge - catX : catX - leftEdge;
      return distanceLeft <= available ? lastTime + distanceLeft / catSpeed : Infinity;
    }

    function warnFromFootsteps(now) {
      const { look, lead } = chooseLook(.25);
      turn.look = look;
      // A footstep warning can start sooner, while the previous gaze deadline stays an upper bound.
      turn.lead = Math.min(lead, phaseEndsAt - now);
      turn.tilt = lookTilt(look);
      turn.warningAt = now;
      turn.warned = true;
      phaseEndsAt = now + turn.lead;
    }

    function changeTurn() {
      if (phase === 'watch') {
        beginTurn(lastTime);
        playSound('away');
        return;
      }

      if (swat !== null || canStep(direction())) {
        finish('lost', swat !== null ? 'swat' : 'step');
      } else if (items.every((item) => !item.required || isDropped(item))) {
        finish('won');
      } else {
        phase = 'watch';
        phaseEndsAt += watchLengths[turn.look];
        playSound('watch');
      }
    }

    function advance(now) {
      while (isPlaying() && lastTime < now) {
        // Advance only to the next event so a late frame cannot reorder them.
        const contactAt = swat?.contactAt ?? Infinity;
        const heading = direction();
        const automaticWarning = phase === 'away' && !turn.warned ? turn.warningAt : Infinity;
        const footstepWarning = footstepWarningAt(heading);
        const until = Math.min(now, phaseEndsAt, gameEndsAt, contactAt, swat?.endsAt ?? Infinity, automaticWarning, footstepWarning);
        if (phase === 'away' && canStep(heading)) {
          const nextX = Math.max(leftEdge, Math.min(rightEdge, catX + heading * (until - lastTime) * catSpeed));
          const walked = Math.abs(nextX - catX);
          if (Math.floor((stride + walked) / stepSpacing) > Math.floor(stride / stepSpacing)) playSound('step');
          stride += walked;
          if (!turn.first && !turn.warned) turn.distance += walked;
          catX = nextX;
          if (swat === null) facing = heading;
        }
        lastTime = until;

        if (lastTime === gameEndsAt) {
          finish('expired');
          return;
        }
        if (lastTime === automaticWarning || lastTime === footstepWarning) {
          if (lastTime === automaticWarning) turn.warned = true;
          else warnFromFootsteps(lastTime);
          playSound('warning');
        }
        if (swat !== null && lastTime === contactAt) {
          swat.contactAt = Infinity;
          if (lastTime < phaseEndsAt) {
            const target = nearbyItem(facing);
            if (target) {
              target.pushes += 1;
              target.pushedAt = lastTime;
              playSound(`${target.id}Push`);
              if (isDropped(target)) {
                gameEndsAt += target.bonus;
                timeBonus.textContent = `+${target.bonus / 1000} 秒`;
                bonusEndsAt = lastTime + 1050;
                playSound('bonus');
                if (target.id === 'bell' && !turn.warned) {
                  phaseEndsAt = Math.min(phaseEndsAt, lastTime + bellWarningLead);
                  turn.lead = phaseEndsAt - lastTime;
                  turn.warningAt = lastTime;
                  turn.warned = true;
                  playSound('warning');
                }
              }
            }
          }
        }
        if (swat !== null && lastTime >= swat.endsAt) swat = null;
        if (lastTime === phaseEndsAt) changeTurn();
      }
    }

    async function unlockAudio() {
      if (!GameAudioContext || !soundEnabled) return;
      try {
        audioContext ??= new GameAudioContext();
        const resumed = audioContext.state !== 'running' ? audioContext.resume() : undefined;
        if (!failureBuffer) {
          // Inline the MP3 so opening index.html directly also works without a server.
          const encodedClip = document.querySelector('#failure-audio').content.textContent;
          const bytes = Uint8Array.from(atob(encodedClip), (byte) => byte.charCodeAt(0));
          failureBuffer = audioContext.decodeAudioData(bytes.buffer).catch(() => null);
        }
        await resumed;
      } catch {
        // Audio availability must not interrupt the round.
      }
    }

    function canPlaySound() {
      return soundEnabled && !document.hidden && audioContext?.state === 'running';
    }

    function startSoundSource(source, start) {
      soundSources.add(source);
      source.onended = () => soundSources.delete(source);
      source.start(start);
    }

    function stopSounds() {
      for (const source of soundSources) source.stop();
      soundSources.clear();
    }

    function playSound(name) {
      if (!canPlaySound()) return;
      const now = audioContext.currentTime;
      for (const [wave, frequency, duration, volume, delay = 0, endFrequency = frequency] of soundEffects[name]) {
        const start = now + delay;
        const end = start + duration;
        const level = audioContext.createGain();
        level.gain.setValueAtTime(.0001, start);
        level.gain.linearRampToValueAtTime(volume, start + .005);
        level.gain.exponentialRampToValueAtTime(.0001, end);
        level.connect(audioContext.destination);

        let source;
        if (wave === 'noise') {
          if (!noiseBuffer) {
            noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate, audioContext.sampleRate);
            const samples = noiseBuffer.getChannelData(0);
            for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
          }
          source = audioContext.createBufferSource();
          source.buffer = noiseBuffer;
          const filter = audioContext.createBiquadFilter();
          filter.type = 'bandpass';
          filter.Q.value = .7;
          filter.frequency.setValueAtTime(frequency, start);
          filter.frequency.exponentialRampToValueAtTime(endFrequency, end);
          source.connect(filter).connect(level);
        } else {
          source = audioContext.createOscillator();
          source.type = wave;
          source.frequency.setValueAtTime(frequency, start);
          source.frequency.exponentialRampToValueAtTime(endFrequency, end);
          source.connect(level);
        }
        startSoundSource(source, start);
        source.stop(end);
      }
    }

    async function playFailure(finishedAt) {
      if (!canPlaySound()) return;
      const buffer = await failureBuffer;
      if (!buffer || !canPlaySound() || (phase !== 'lost' && phase !== 'expired') || lastTime !== finishedAt) return;
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);
      startSoundSource(source, audioContext.currentTime);
    }

    function renderItem(item, now, nearby) {
      const dropped = isDropped(item);
      const isNear = item === nearby;
      const atEdge = item.pushes === item.poses.length - 1;
      if (item.element.hasAttribute('data-near') !== isNear) {
        if (isNear) item.element.dataset.near = 'true';
        else delete item.element.dataset.near;
      }
      item.element.toggleAttribute('data-at-edge', atEdge);
      if (Number(item.element.dataset.pushes || 0) !== item.pushes) {
        if (item.pushes > 0) item.element.dataset.pushes = String(item.pushes);
        else delete item.element.dataset.pushes;
      }
      if (item.element.hasAttribute('data-dropped') !== dropped) {
        if (dropped) item.element.dataset.dropped = 'true';
        else delete item.element.dataset.dropped;
        item.shadow.setAttribute('visibility', dropped ? 'hidden' : 'visible');
        item.landing.setAttribute('visibility', 'hidden');
      }

      const from = item.poses[Math.max(0, item.pushes - 1)];
      const to = dropped ? item.landingPose : item.poses[item.pushes];
      const duration = dropped ? dropLength : slideLength;
      const progress = item.pushedAt === null ? 1 : Math.min(1, (now - item.pushedAt) / duration);
      const travel = dropped ? progress : 1 - (1 - progress) ** 2;
      const x = dropped ? item.x + (to.x - item.x) * progress : item.x;
      let y = from.y + (to.y - from.y) * travel;
      if (dropped) {
        const roll = Math.min(1, progress / .22);
        const fall = Math.max(0, (progress - .22) / .78) ** 1.65;
        y = from.y + 31 * roll + (to.y - from.y - 31) * fall;
      }
      const rock = to.rock && !reducedMotion.matches ? Math.sin(progress * Math.PI * 4) * (1 - progress) * to.rock : 0;
      const rotation = from.angle + (to.angle - from.angle) * travel + rock;
      const pose = `translate(${x} ${y}) rotate(${rotation})`;
      transform(item.element, pose);
      if (!dropped) transform(item.shadow, pose);

      if (dropped && progress === 1 && !item.landed) {
        item.landed = true;
        item.landing.setAttribute('visibility', 'visible');
        if (isPlaying() || phase === 'won') playSound(`${item.id}Land`);
      }
    }

    function renderOwner(pose, remaining, glance) {
      const targetFrame = turn?.look === 'side' ? ownerSideFrame : ownerFrontFrame;
      const footsteps = Math.min(1, (turn?.distance ?? 0) / footstepDistance);
      let frameIndex = 0;
      let lift = 0;
      let tilt = 0;

      if (pose === 'watch') {
        frameIndex = targetFrame;
        if (glance && !reducedMotion.matches) {
          tilt = -3 * glance;
        }
      } else if (pose === 'warning') {
        if (reducedMotion.matches) {
          lift = 6;
        } else {
          const progress = Math.max(0, Math.min(1, 1 - remaining / turn.lead));
          lift = 7 * Math.min(1, progress / .12) * (1 - progress);
          const travel = Math.max(0, (progress - .12) / .88);
          const eased = travel * (2 - travel);
          frameIndex = Math.floor(footsteps + (targetFrame - footsteps) * eased);
          tilt = -3 * footsteps * (1 - travel) + (turn.tilt ?? 0) * .3 * Math.sin(Math.PI * travel);
        }
      } else {
        frameIndex = Math.floor(footsteps);
        if (!reducedMotion.matches) tilt = -3 * footsteps;
        else frameIndex = 0;
      }

      const x = frameIndex % ownerAtlasColumns * ownerFrameWidth;
      const y = Math.floor(frameIndex / ownerAtlasColumns) * ownerFrameHeight;
      const crop = `${x} ${y} ${ownerFrameWidth} ${ownerFrameHeight}`;
      if (ownerFrame.getAttribute('viewBox') !== crop) ownerFrame.setAttribute('viewBox', crop);
      transform(owner, `translate(0 ${-lift}) rotate(${tilt} 748 264)`);
    }

    function render(now) {
      const remaining = phaseEndsAt - now;
      const cue = phase === 'away' && turn.warned ? 'warning' : phase;
      const ownerPose = timeoutFrame?.ownerPose ?? (phase === 'away' ? cue : 'watch');
      if (statusBadge.dataset.pose !== cue) {
        statusBadge.dataset.pose = cue;
        statusLabel.textContent = labels[cue];
      }
      const left = phase === 'ready' ? startingTime : Math.max(0, gameEndsAt - (isPlaying() ? now : lastTime));
      const tenths = (Math.ceil(left / 100) / 10).toFixed(1);
      if (time.textContent !== tenths) time.textContent = tenths;
      clock.toggleAttribute('data-low', left <= 3000);
      timeBonus.toggleAttribute('hidden', !isPlaying() || now >= bonusEndsAt);

      const elevation = Math.min(1, Math.max(0, (Math.abs(catX - startX) - 42) / 20)) * 12;
      transform(cat, `translate(${catX - startX} ${elevation}) translate(${startX} 0) scale(${facing} 1) translate(${-startX} 0)`);
      const stepping = timeoutFrame?.stepping ?? (phase === 'away' && canStep(direction()));
      const gait = stepping && !reducedMotion.matches ? Math.sin(stride / 12) : 0;
      const lift = caughtAction === 'step' ? 7 : Math.max(0, gait) * 6;

      let swing = 0;
      if (swat !== null) {
        const elapsed = now - swat.startedAt;
        // The paw reaches the object at impact, then takes longer to retract.
        swing = elapsed < contactDelay ? elapsed / contactDelay : (swatLength - elapsed) / (swatLength - contactDelay);
      }
      if (caughtAction === 'swat') swing = Math.max(.4, swing);
      transform(forepaw, swing > 0 ? `translate(${swing * 48} ${swing * 3}) rotate(${-swing * 57} 251 358)` : `translate(${lift / 2} ${-lift})`);
      const rearLift = Math.max(0, -gait) * 6;
      transform(farPaw, `translate(${-rearLift / 2} ${-rearLift})`);

      const victoryElapsed = phase === 'won' && !reducedMotion.matches ? now - lastTime : -1;
      cat.toggleAttribute('data-blink', victoryElapsed >= 665 && victoryElapsed < 800);
      const watchElapsed = phase === 'watch' || timeoutFrame?.ownerPose === 'watch' ? watchLengths[turn.look] - remaining : -1;
      const recentDrop = watchElapsed >= 210 && watchElapsed <= 670 &&
        items.some((item) => isDropped(item) && item.pushedAt >= turn.startedAt);

        item.landed = false;

      outcome.hidden = true;

      frame = requestAnimationFrame(tick);

    function inputTime() {

      const now = performance.now();
      // Check deadlines before accepting a release or new press.
      advance(now);
      if (isPlaying()) return now;

    function moveInput(token, value) {

      if (now === null) return;
      if (value === 0) moves.delete(token);
      else moves.set(token, value);

      if (phase === 'watch' && canStep(heading)) {

        finish('lost', 'step');

      render(now);

    function swatInput() {

    document.addEventListener('keydown', (event) => {

    document.addEventListener('keyup', (event) => {

      moveInput(event.code, 0);

        button.setPointerCapture(event.pointerId);
        moveInput(event.pointerId, Number(button.dataset.move));
      });
      for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {

      // The retry button can appear under a touch that already caused a loss.
      if (event.target.closest('.touch-button')) event.preventDefault();
    }, { passive: false });
    swatButton.addEventListener('pointerdown', (event) => {
      if (event.button !== 0 || !isPlaying()) return;
      event.preventDefault();
      swatInput();
    });
    swatButton.addEventListener('click', (event) => {
      if (event.detail === 0) swatInput();
    });
    startButton.addEventListener('click', start);
    retryButton.addEventListener('click', start);
    soundButton.hidden = !GameAudioContext;
    soundButton.addEventListener('click', (event) => {
      soundEnabled = !soundEnabled;
      soundButton.setAttribute('aria-pressed', String(soundEnabled));
      soundButton.textContent = soundEnabled ? '音效开' : '音效关';
      if (soundEnabled) unlockAudio();
      else stopSounds();
      if (event.detail > 0 && isPlaying()) document.querySelector('main').focus({ preventScroll: true });
    });

    function releaseMovement() {
      const now = inputTime();
      moves.clear();
      showPressedButtons();
      if (now !== null) render(now);
    }
    window.addEventListener('blur', releaseMovement);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopSounds();
      if (document.hidden && isPlaying()) {
        releaseMovement();
        if (!isPlaying()) return;
        pauseStartedAt = lastTime;
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
      } else if (!document.hidden && pauseStartedAt !== null) {
        unlockAudio();
        const now = performance.now();
        const offset = now - pauseStartedAt;
        phaseEndsAt += offset;
        gameEndsAt += offset;
        turn.startedAt += offset;
        turn.warningAt += offset;
        if (bonusEndsAt > 0) bonusEndsAt += offset;
        if (swat !== null) {
          swat.startedAt += offset;
          swat.contactAt += offset;
          swat.endsAt += offset;
        }
        for (const item of items) {
          if (item.pushedAt !== null) item.pushedAt += offset;
        }
        lastTime = now;
        pauseStartedAt = null;
        frame = requestAnimationFrame(tick);
      }
    });
